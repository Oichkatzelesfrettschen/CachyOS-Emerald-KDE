# Recolor map for the Emerald Xcursor theme.
#
# Bibata's source SVGs carry three sentinel colors that its renderer swaps
# per variant: #00FF00 is the pointer body, #FF0000 a secondary body fill,
# #0000FF the outline.  The Emerald theme maps the two body sentinels to a
# bright emerald and the outline to a deep emerald-black, so the pointer
# reads as emerald on the family's dark panels while the dark rim keeps it
# legible over the green wallpaper.
#
# scripts/build-emerald-cursor.sh sources this file; scripts/check-scheme-
# contrast.py reads the same values and gates BODY in the emerald hue band
# with a BODY-vs-EDGE contrast floor.  One source of truth for both.
BODY=#66F2C2
SECONDARY=#66F2C2
EDGE=#04231B
